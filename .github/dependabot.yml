version: 2
updates:
  # Bun/npm dependencies for main application
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    reviewers:
      - "kotadb/engineering"
    labels:
      - "dependencies"
      - "security"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Bun/npm dependencies for automation tooling
  - package-ecosystem: "npm"
    directory: "/automation"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    reviewers:
      - "kotadb/engineering"
    labels:
      - "dependencies"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
